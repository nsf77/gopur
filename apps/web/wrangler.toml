# Cloudflare Pages project. Custom domain target: gopur.pur.run
# First deploy creates the project if needed:
#   bun run --filter @gopur/web build
#   bunx wrangler pages deploy dist --project-name gopur-web
# Then attach hostname gopur.pur.run in the Pages dashboard.
# Do not point go.pur.run here — that hostname stays on Worker gopur-app.

name = "gopur-web"
compatibility_date = "2026-10-10"
pages_build_output_dir = "./dist"
