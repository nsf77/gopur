name = "gopur-api"
main = "src/worker.ts"
compatibility_date = "2026-10-10"
account_id = "f13e891dc4bb32f8c1450b76344ad1ca" # pragma: allowlist secret

# Daily importer: 00:00 HKT (16:00 UTC). Manual: POST /import/run with X-Import-Token.
# Set Worker secret IMPORT_TOKEN. Optional: IMPORT_SOURCE_TIMEOUT (Go duration, default 15m).
[triggers]
crons = ["0 16 * * *"]

# D1 created in HKG.
[[d1_databases]]
binding = "DB"
database_name = "gopur"
database_id = "139222d6-55ef-46fd-9e62-41f0b5942559"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "GOPUR_AUTH"
id = "fd21b33de2704609a40e6b27a9d18325"

[[durable_objects.bindings]]
name = "CHAT_HUB"
class_name = "ChatHub"

[[migrations]]
tag = "v4-chat-hub"
new_classes = ["ChatHub"]
